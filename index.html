<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="로나지지 서비스 종료 안내" />
    <title>RONA-GG</title>
    <link rel="icon" type="image/png" href="assets/time-shard.png" />
    <style>
      :root { color-scheme: dark; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background: #000;
        color: #f5f5f5;
      }
      main { width: min(92vw, 720px); padding: 32px 0; text-align: center; }
      .failed-image {
        display: block;
        width: min(72vw, 520px);
        height: auto;
        margin: 0 auto 24px;
        border: 0;
        background: transparent;
        cursor: default;
        user-select: none;
        -webkit-user-drag: none;
      }
      p {
        margin: 0;
        font-size: clamp(15px, 2.4vw, 20px);
        line-height: 1.75;
        word-break: keep-all;
      }
      a { color: #77d8ff; font-weight: 700; text-underline-offset: 4px; }
      a:hover, a:focus-visible { color: #b9ecff; }
      @media (max-width: 520px) {
        main { width: min(90vw, 420px); }
        .failed-image { width: min(88vw, 420px); margin-bottom: 18px; }
        p { font-size: 15px; }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        id="failedImage"
        class="failed-image"
        src="assets/enhancement-failed.png"
        alt="강화 실패로 파손된 장비"
        draggable="false"
      />
      <p>
        강화실패로인해 로나접었습니다.<br />
        <a href="https://xn--910b70mg3hp6e.com/">로나옥션.COM</a> 을 이용해주세요.
      </p>
    </main>
    <script>
      (() => {
        const image = document.getElementById("failedImage");
        let clickCount = 0;
        let resetTimer;
        image.addEventListener("click", () => {
          clickCount += 1;
          window.clearTimeout(resetTimer);
          if (clickCount >= 3) {
            window.location.href = "auction.html";
            return;
          }
          resetTimer = window.setTimeout(() => { clickCount = 0; }, 1200);
        });
      })();
    </script>
  </body>
</html>
